name: Order Service CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'order-service/**'
      - 'common-library/**'
      - 'pom.xml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'order-service/**'
      - 'common-library/**'
      - 'pom.xml'

env:
  SERVICE_NAME: order-service
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/order-service
  AWS_REGION: ap-south-1

jobs:
  # JOB 1 — Build, Test & Push Docker Image
  #----------------------------------------
  build-and-push:
    name: Build, Test & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Build common-library first — every service needs this
      - name: Build & install common-library
        run: mvn install -pl common-library -am -DskipTests

      # Build & package order-service
      - name: Build order-service
        run: mvn package -pl order-service -am -DskipTests

      # Login to Docker Hub
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Generate Docker tags:
      # main branch  → latest + sha-xxxxxxx
      # develop      → develop + sha-xxxxxxx
      # pull request → only build, no push
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Build & push image to Docker Hub
      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./order-service/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Print image digest
        run: echo "Image pushed → ${{ env.DOCKER_IMAGE }}:sha-${{ github.sha }}"

