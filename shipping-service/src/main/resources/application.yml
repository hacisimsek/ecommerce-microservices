# Shared defaults (Kafka, Eureka, actuator, JPA, virtual threads) come from
# common-library/src/main/resources/shared-defaults.yml; anything here overrides them.
server:
  port: 8085

spring:
  application:
    name: shipping-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/shipping_db
    # No defaults for credentials: provide them via environment (see .env.example)
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

shipping:
  simulation:
    # Orders worth more than this cannot be shipped; triggers refund + stock release
    max-insured-value: ${SHIPPING_MAX_INSURED_VALUE:5000}
