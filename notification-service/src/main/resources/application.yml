# Shared defaults (Kafka, Eureka, actuator, JPA, virtual threads) come from
# common-library/src/main/resources/shared-defaults.yml; anything here overrides them.
server:
  port: 8084

spring:
  application:
    name: notification-service
  data:
    mongodb:
      uri: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/notification?authSource=admin&directConnection=true
      uuid-representation: standard
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD}
