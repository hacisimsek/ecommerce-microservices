# service.yml
apiVersion: v1
kind: Service
metadata:
  name: service-registry
  namespace: ecommerce
  labels:
    app: service-registry
    managed-by: argocd
spec:
  type: ClusterIP
  selector:
    app: service-registry
  ports:
  - name: http
    port: 8761
    targetPort: 8761
    protocol: TCP
