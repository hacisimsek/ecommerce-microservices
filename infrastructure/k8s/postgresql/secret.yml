# ⚠️ Apply manually for local minikube:
#   kubectl create secret generic postgresql-secret \
#     --from-literal=postgres-password=postgres \
#     -n ecommerce
#
# For production, use AWS Secrets Manager + External Secrets Operator

apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: ecommerce
  labels:
    app: postgresql
    managed-by: argocd
type: Opaque
data:
  postgres-password: cG9zdGdyZXM= # base64 of "postgres" — change for production!
