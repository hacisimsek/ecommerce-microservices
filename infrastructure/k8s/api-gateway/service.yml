apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ecommerce
  labels:
    app: api-gateway
    managed-by: argocd
spec:
  type: NodePort # exposed for external access via minikube
  selector:
    app: api-gateway
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30080 # access via minikube ip:30080
    protocol: TCP
