apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ecommerce
  labels:
    app: notification-service
    managed-by: argocd
spec:
  type: ClusterIP
    # internal only — only api-gateway talks to this
    # NOT exposed to internet directly
  selector:
    app: notification-service # routes traffic to pods with this label
  ports:
  - name: http
    port: 8084 # port other services use to call this service
    targetPort: 8084 # port the container listens on
    protocol: TCP
