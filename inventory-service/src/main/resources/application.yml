# Shared defaults (Kafka, Eureka, actuator, JPA, virtual threads) come from
# common-library/src/main/resources/shared-defaults.yml; anything here overrides them.
server:
  port: 8082

spring:
  application:
    name: inventory-service
  data:
    mongodb:
      uri: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/inventory?authSource=admin&directConnection=true
      uuid-representation: standard
