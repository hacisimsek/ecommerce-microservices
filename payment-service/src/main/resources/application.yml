server:
  port: 8083

spring:
  application:
    name: payment-service
  config:
    import: classpath:common-kafka.yml
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/payment_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

payment:
  simulation:
    # Probability that the fake provider declines a payment (0.0 - 1.0)
    failure-rate: ${PAYMENT_FAILURE_RATE:0.0}
    # Orders above this amount are always declined, to exercise compensation deterministically
    max-amount: ${PAYMENT_MAX_AMOUNT:10000}
