# Shared defaults (Kafka, Eureka, actuator, JPA, virtual threads) come from
# common-library/src/main/resources/shared-defaults.yml; anything here overrides them.
server:
  port: 8083

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/payment_db
    # No defaults for credentials: provide them via environment (see .env.example)
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

payment:
  simulation:
    # Probability that the fake provider declines a payment (0.0 - 1.0)
    failure-rate: ${PAYMENT_FAILURE_RATE:0.0}
    # Orders above this amount are always declined, to exercise compensation deterministically
    max-amount: ${PAYMENT_MAX_AMOUNT:10000}
