# Defaults shared by every business service. Loaded with the LOWEST precedence by
# SharedDefaultsEnvironmentPostProcessor, so a service's own application.yml or any
# environment variable overrides them.
spring:
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only checks that entities match it
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer keeps an undeserializable record from looping forever
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        # The producer's __TypeId__ header selects the concrete event class
        spring.json.trusted.packages: com.hacisimsek.common.event.*

# Synchronous calls (e.g. catalog lookups) through Spring Cloud CircuitBreaker: give up after
# 3s, open the circuit when half of the last 20 calls failed, probe again after 10s
resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 3s
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
